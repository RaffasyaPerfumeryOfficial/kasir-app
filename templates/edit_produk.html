{% extends "base.html" %}
{% block title %}Edit Produk{% endblock %}
{% block content %}
<div class="topbar"><h2>Edit Produk</h2></div>
<div class="card" style="max-width:520px">
  <form method="post" action="/produk/update/{{ produk.id }}">
    <input name="nama" value="{{ produk.nama }}" required>
    <input name="kode" value="{{ produk.kode or '' }}">
    <input name="kategori" value="{{ produk.kategori or '' }}">
    <input name="harga_modal" type="number" value="{{ '%0.0f'|format(produk.harga_modal or 0) }}">
    <input name="harga" type="number" value="{{ '%0.0f'|format(produk.harga) }}" required>
    <input name="stok" type="number" value="{{ produk.stok }}" required>
    <button style="width:100%">Simpan Perubahan</button>
  </form>
  <p style="margin-top:10px"><a href="/manajemen">Kembali ke Produk</a></p>
  <hr style="margin:16px 0">
  <h4>Notes Parfum</h4>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
    <button type="button" style="background:var(--success)" onclick="ambil(0)">Lihat Notes Tersimpan (GRATIS)</button>
    <button type="button" style="background:#2563eb" onclick="ambil(1)">Ambil Ulang dari Fragella (BAYAR ±Rp 82)</button>
  </div>
  <div id="fetchResult" style="margin-top:10px;white-space:pre-line"></div>
</div>
<script>
function ambil(refresh){
if(refresh===1&&!confirm("Ini akan memotong saldo Fragella $0.005 (±Rp 82). Lanjutkan?"))return;
const out=document.getElementById('fetchResult');
out.textContent='Memuat...';
fetch('/produk/fetch_notes/{{ produk.id }}?refresh='+refresh).then(r=>r.json()).then(d=>{
if(!d.ok){out.innerHTML='<span style="color:var(--danger)">'+d.pesan+'</span>';return;}
let head='';
if(d.gratis){head='<strong style="color:var(--success)">GRATIS</strong> - dari penyimpanan lokal:';}
else{head='<strong style="color:#2563eb">Baru diambil dari Fragella ($0.005)</strong> - sudah DISIMPAN permanen, selanjutnya gratis:';}
out.innerHTML=head+'\n'+d.notes.replace(/\|/g,'\n');
});
}
</script>
{% endblock %}
