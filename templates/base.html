<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ nama_toko }}{% endblock %} - {{ nama_toko }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <h1>{{ nama_toko }}</h1>
{% if user_role == "admin" %}
    <a href="/ai">Pesan AI</a>
    <a href="/dashboard">Dashboard</a>
{% endif %}

    <a href="/kasir">Kasir</a>
    <a href="/riwayat-hari">Riwayat</a>

{% if user_role == "admin" %}
    <a href="/manajemen">Produk</a>

    <a href="/pembelian">Pembelian</a>
    <div>
      <a href="/laporan">Laporan Penjualan</a>
    </div>

    <a href="/labarugi">Laba Rugi</a>
    <a href="/tutup">Tutup Kasir</a>
    <a href="/backup-restore">Backup & Restore</a>
    <a href="/backup-history">Riwayat Backup</a>
    <a href="/anggota">Anggota</a>
{% endif %}
  <a href="/logout">Keluar</a>
  </div>
  <div class="main">
    {% block content %}{% endblock %}
  </div>
</div>

<script>
function rpWalker(){
function fmt(s){return s.replace(/\d{4,}/g,function(m2){return m2.replace(/\B(?=(\d{3})+(?!\d))/g,'.')})}
var walk=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null,false);
var nodes=[];
while(walk.nextNode())nodes.push(walk.currentNode);
nodes.forEach(function(n){
var tag=n.parentNode?n.parentNode.tagName:'';
if(tag==='SCRIPT'||tag==='STYLE'||tag==='INPUT'||tag==='OPTION'||tag==='SELECT'||tag==='TEXTAREA')return;
var t=n.nodeValue;
if(/\d{4,}/.test(t)&&t.indexOf('.')===-1){n.nodeValue=fmt(t);}
});
}
document.addEventListener('DOMContentLoaded',rpWalker);
</script>
</body>
</html>
