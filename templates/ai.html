{% extends "base.html" %}
{% block title %}Pesan AI{% endblock %}
{% block content %}
<div class="topbar"><h2>Pesan AI</h2></div>
<div class="card" style="max-width:720px">
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <button type="button" onclick="ask('berapa omset hari ini?')">1. Omzet hari ini</button>
    <button type="button" onclick="ask('produk apa yang harus dijual hari ini?')">2. Harus dijual hari ini</button>
    <button type="button" onclick="ask('produk apa yang laris tetapi hampir habis?')">3. Laris tapi hampir habis</button>
    <button type="button" onclick="ask('berapa laba hari ini?')">4. Laba hari ini</button>
    <button type="button" onclick="ask('berapa laba dan margin bulan ini?')">5. Laba bulan ini</button>
    <button type="button" onclick="ask('produk apa yang tidak laku tapi stok banyak?')">6. Dead stock</button>
    <button type="button" onclick="ask('apa top 5 terlaris bulan ini?')">7. Top 5 terlaris</button>
    <button type="button" onclick="ask('omzet minggu ini naik atau turun?')">8. Omzet naik/turun</button>
    <button type="button" onclick="ask('berapa total qris bulan ini?')">9. Total QRIS</button>
    <button type="button" onclick="ask('produk apa yang perlu restock?')">10. Perlu restock</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <button type="button" style="background:var(--success)" onclick="mulaiBaru()">+ Percakapan Baru</button>
    <button type="button" style="background:#64748b" onclick="lihatRiwayat()">Riwayat Percakapan</button>
  </div>
  <div id="chat" style="max-height:420px;overflow-y:auto;margin-bottom:12px"></div>
  <form onsubmit="kirim(event)" style="display:flex;gap:10px">
    <input id="q" placeholder="Tulis pertanyaan... contoh: still dari brand apa?" required style="margin:0">
    <button type="submit">Kirim</button>
  </form>
  <p style="margin-top:10px;color:var(--muted)">AI mengingat konteks: setelah tanya produk, lanjutkan dengan "notesnya apa?", "ada yang lainnya?", atau "ya".</p>
</div>
<script>
let lastProduk='';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function addAnda(q){document.getElementById('chat').innerHTML+='<p style="background:#e0e7ff;padding:10px;border-radius:8px;margin:8px 0"><strong>Anda:</strong> '+esc(q)+'</p>';}
function addAI(a){document.getElementById('chat').innerHTML+='<p style="background:#dcfce7;padding:10px;border-radius:8px;margin:8px 0;white-space:pre-line"><strong>AI:</strong>\n'+esc(a)+'</p>';}
function salam(){document.getElementById('chat').innerHTML='<p style="background:#dcfce7;padding:10px;border-radius:8px;margin:8px 0;white-space:pre-line"><strong>AI:</strong> Halo! Saya asisten MEKAR SARI.\nKlik tombol 1-10 atau ketik pertanyaan. Percakapan tersimpan otomatis.</p>';}
function ask(q){
addAnda(q);
fetch('/ai/jawab?q='+encodeURIComponent(q)+'&ctx='+encodeURIComponent(lastProduk)).then(r=>r.json()).then(d=>{
if(d.produk){lastProduk=d.produk;}
addAI(d.jawab);
const c=document.getElementById('chat');c.scrollTop=c.scrollHeight;
});
}
function kirim(e){e.preventDefault();ask(document.getElementById('q').value);document.getElementById('q').value='';}
function mulaiBaru(){salam();lastProduk='';}
function lihatRiwayat(){
fetch('/ai/riwayat').then(r=>r.json()).then(d=>{
const c=document.getElementById('chat');c.innerHTML='';
if(d.length===0){salam();return;}
d.forEach(x=>{addAnda(x.q);addAI(x.a);});
c.scrollTop=c.scrollHeight;
});
}
lihatRiwayat();
</script>

<div style="margin:10px 0"><button style="background:#0ea5e9;color:#fff;border:0;padding:10px 16px;border-radius:999px;font-weight:600" onclick="kirimBriefing()">🌅 Briefing Pagi</button></div>
<script>
function kirimBriefing(){
var i=document.querySelector('input[placeholder*="Tulis"]');
if(i){i.value='briefing pagi';}
var b=[].slice.call(document.querySelectorAll('button')).find(function(x){return x.textContent.trim()==='Kirim';});
if(b)b.click();
}
</script>
{% endblock %}
