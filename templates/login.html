<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Kasir</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f8;display:flex;align-items:center;justify-content:center;height:100vh}
.kotak{background:white;padding:24px;border-radius:8px;width:300px;text-align:center}
input{width:100%;padding:8px;margin:6px 0;box-sizing:border-box}
button{width:100%;padding:8px;margin-top:8px}
.merah{color:red}
</style>
</head>
<body>
<div class="kotak">
<h1>Login Kasir</h1>
<p class="merah">{{ pesan }}</p>
<form method="post" action="/login/masuk">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Masuk</button>
</form>
<p>admin / 1234<br>kasir / kasir123</p>
</div>
</body>
</html>
