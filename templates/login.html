<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login - {{ nama_toko }}</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.login-wrap{display:flex;align-items:center;justify-content:center;height:100vh}
.login-card{width:340px}
.login-card h1{text-align:center;margin-bottom:16px;color:var(--primary)}
.merah{color:var(--danger);text-align:center}
</style>
</head>
<body>
<div class="login-wrap">
<div class="card login-card">
<h1>{{ nama_toko }}</h1>
<p class="merah">{{ pesan }}</p>
<form method="post" action="/login/masuk">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button style="width:100%">Masuk</button>
</form>
</div>
</div>
</body>
</html>
