<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kasir</title>
<style>
body{font-family:Arial;margin:20px;background:#f4f6f8}
h1{margin-top:0}
table{border-collapse:collapse;background:white}
td,th{border:1px solid #ccc;padding:8px}
button{padding:6px 12px;cursor:pointer}
.kotak{background:white;padding:16px;margin-top:16px;border-radius:8px;max-width:500px}
</style>
</head>
<body>
<h1>Aplikasi Kasir</h1><p><a href="/kasir">Kasir</a> | <a href="/riwayat">Riwayat Transaksi</a> | <a href="/manajemen">Manajemen Produk</a></p>
<table>
<tr><th>Nama</th><th>Harga</th><th>Stok</th><th></th></tr>
{% for p in produk_list %}
<tr>
<td>{{ p.nama }}</td>
<td>{{ p.harga }}</td>
<td>{{ p.stok }}</td>
<td><button onclick="tambah({{ p.id }},'{{ p.nama }}',{{ p.harga }})">+ Keranjang</button></td>
</tr>
{% endfor %}
</table>
<div class="kotak">
<h2>Keranjang</h2>
<ul id="cart"></ul>
<p>Total: Rp <span id="total">0</span></p>
<input id="bayar" type="number" placeholder="Uang bayar">
<button onclick="bayar()">Bayar</button>
<p>Kembalian: Rp <span id="kembalian">0</span></p>
</div>
<script>
let cart=[];
function tambah(id,nama,harga){
let it=cart.find(i=>i.id===id);
if(it)it.jumlah++;else cart.push({id,nama,harga,jumlah:1});
render();
}
function render(){
let ul=document.getElementById('cart');ul.innerHTML='';let t=0;
cart.forEach(i=>{t+=i.harga*i.jumlah;let li=document.createElement('li');li.textContent=i.nama+' x'+i.jumlah+' = '+i.harga*i.jumlah;ul.appendChild(li);});
document.getElementById('total').textContent=t;
}
function bayar(){
let b=parseFloat(document.getElementById('bayar').value||0);
fetch('/transaksi',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({items:cart.map(i=>({produk_id:i.id,jumlah:i.jumlah})),bayar:b})})
.then(r=>r.json()).then(d=>{
if(d.kembalian!==undefined){window.location.href='/struk/'+d.id;}
else{alert(JSON.stringify(d.detail||d));}
});
}
</script>
</body>
</html>
